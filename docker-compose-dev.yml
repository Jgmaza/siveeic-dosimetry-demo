version: '3.7'

services:
  frontend:
    container_name: siveeic
    build:
      context: .
      dockerfile: ./Dockerfile_prod
      target: dev-siveeic
      args:
        APP_ENV: dev
    restart: always
    ports:
      - 4200:4200
    volumes:
      - .:/app
      - node_modules_frontend:/app/node_modules
    command: >
      sh -c "if [ ! -d 'node_modules' ] || [ -z \"$(find node_modules -mindepth 1 2>/dev/null)\" ]; then npm install; fi && npm run debug"
    networks:
      - siveeic-network

  web:
    image: nginx:alpine
    container_name: nginx_cors_proxy
    ports:
      - "9090:80"
    volumes:
      - ./nginx/dev/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - siveeic-network      
    depends_on:
      - frontend
volumes:
  node_modules_frontend:
    driver: local
networks:
  siveeic-network:
    name: siveeic-network
    driver: bridge
