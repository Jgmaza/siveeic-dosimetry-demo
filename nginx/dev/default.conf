server {
    listen 80;
    server_name localhost;

    # 1. Rutas para el Frontend (Angular/React en puerto 4200)
    location / {
        proxy_pass http://siveeic:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Rutas para el API (Backend en puerto 3100)
    # Toda petición que empiece con /api/ se redirigirá al backend
    location /api/ {
        proxy_pass http://api_siveeic:3010/api/; # El '/' final elimina '/api/' de la ruta que recibe el backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración para archivos grandes
        client_max_body_size 200M;
        client_body_buffer_size 128k;
        
        # Timeouts extendidos para carga de archivos grandes
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;        
    }
}