<nb-card>
  <nb-card-header>
    {{ 'GLOBAL.estaciones.titulo' | translate }}
    <ng-container *ngIf="operador">
      | Operador : {{operador.name}}
    </ng-container>
  </nb-card-header>
  <nb-card-body>
    <toaster-container [toasterconfig]="config"></toaster-container>
    <a routerLink="" (click)="onReturn()"> <button *ngIf="!cambiotab" class="btn btn-link btn-sm"  ghost> <i class="nb-arrow-dropleft"></i>
      {{ 'GLOBAL.regresar' | translate }}</button> </a>

    <ng2-smart-table *ngIf="!cambiotab" [settings]="settings" [source]="source" (delete)="onDelete($event)"
    (rowSelect)="itemselec($event)" (edit)="onEdit($event)" (create)="onCreate($event)" (duplicate)="onDuplicate($event)" (custom)="onCustomAction($event)">
    </ng2-smart-table>
  </nb-card-body>
</nb-card>
