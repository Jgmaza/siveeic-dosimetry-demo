<div class="col-md-12 col-lg-12 ">
    <nb-card>
      <nb-card-header>
        {{ 'GLOBAL.estaciones.operador' | translate }}
      </nb-card-header>
      <nb-card-body>
        <div class="row margin15">
        
            <div class="col-lg-2" *ngIf="!cambiotab">
              <form [formGroup]="registroForm">
                <div class="row">
                  <div class="col-lg-12">
                    <div class="form-group" >
                      <label for="paginas" class="label col-form-label">
                        Mostrar : 
                      </label>
                        <select id="paginas" class="form-control" formControlName="Rowspage"  (change)="paginas()" style="max-width:50%;" >
                        <option [ngValue]="5" >5</option>
                        <option [ngValue]="10" >10</option>
                        <option [ngValue]="25" >25</option>
                        <option [ngValue]="50" >50</option>
                        <option [ngValue]="100" >100</option>
                        <option [ngValue]="200" >200</option>
                      </select>
                    </div>  
                  </div>   
                </div> 
            </form>
          </div> 
          <div class="col-md-3">
            <button (click)="exportAsXLSX()" class="btn btn-primary btn-sm fo mb-4 mt-2">Descargar empresas</button>
          </div>
          <div class="col-md-7">
          </div>
        </div> 
        <toaster-container [toasterconfig]="config"></toaster-container>
        <ng2-smart-table [settings]="settings" [source]="source"
          (rowSelect)="itemselec($event)" (create)="onCreate($event)" (custom)="onCustomAction($event)" >
        </ng2-smart-table>
        
      </nb-card-body>
    </nb-card>
  </div>
