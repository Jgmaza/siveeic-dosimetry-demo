<div class="col-md-12 col-lg-12">
  <toaster-container [toasterconfig]="config"></toaster-container>

  <nb-card>
    <nb-card-header class="d-flex justify-content-between align-items-center flex-wrap">
      <div>
        <i class="fa fa-cubes mr-2 text-info"></i>
        <strong>Administración de Catálogos VUCE — Modelos o Referencias</strong>
      </div>
      <div>
        <button class="btn btn-primary btn-sm" (click)="onCreate()">
          <i class="fa fa-plus-circle mr-1"></i> Nuevo Modelo o Referencia
        </button>
      </div>
    </nb-card-header>

    <nb-card-body>
      <!-- Barra de Filtros Rápidos -->
      <div class="row mb-3 align-items-end">
        <div class="col-md-6">
          <div class="form-group mb-0">
            <label for="searchFilter" class="font-weight-bold"><small>Buscar por Descripción / ID:</small></label>
            <div class="input-group input-group-sm">
              <input
                type="text"
                id="searchFilter"
                class="form-control"
                placeholder="ej: MODEL-X, REF-01, 15..."
                [(ngModel)]="searchQuery"
                (keyup.enter)="loadData()"
              />
              <div class="input-group-append">
                <button class="btn btn-outline-secondary" type="button" (click)="loadData()">
                  <i class="fa fa-search"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6 d-flex justify-content-end align-items-center mt-2 mt-md-0">
          <label for="pageSizeSelect" class="mb-0 mr-2"><small>Registros por página:</small></label>
          <select
            id="pageSizeSelect"
            class="form-control form-control-sm"
            style="width: auto;"
            [(ngModel)]="pageSize"
            (change)="onPageSizeChange($event.target.value)"
          >
            <option [value]="10">10</option>
            <option [value]="25">25</option>
            <option [value]="50">50</option>
            <option [value]="100">100</option>
          </select>
          <button class="btn btn-outline-secondary btn-sm ml-2" (click)="limpiarFiltros()" title="Limpiar Filtros">
            <i class="fa fa-eraser"></i>
          </button>
        </div>
      </div>

      <!-- Grilla Smart Table -->
      <div class="table-responsive">
        <ng2-smart-table
          [settings]="settings"
          [source]="source"
          (edit)="onEdit($event)"
          (delete)="onDelete($event)"
        ></ng2-smart-table>
      </div>
    </nb-card-body>
  </nb-card>
</div>
