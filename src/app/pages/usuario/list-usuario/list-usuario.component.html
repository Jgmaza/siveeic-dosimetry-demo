<div class="col-md-12 col-lg-12 ">
  <nb-card>
    <nb-card-header>
      {{ 'MENU.usuario.usuario' | translate }}
    </nb-card-header>
    <nb-card-body>
      <div class="row margin15">
        <div class="col-md-3">
          <button (click)="exportAsXLSX()" class="btn btn-primary btn-sm fo mb-4 mt-2">Descargar usuarios</button>
        </div>
        <div class="col-md-9">
        </div>
      </div>       
      <toaster-container [toasterconfig]="config"></toaster-container>
      <button *ngIf="cambiotab" (click)="activetab()" class="btn btn-success btn-sm"> <i class="nb-arrow-dropleft"></i>
        {{ 'GLOBAL.regresar' | translate }}</button>
      <ng2-smart-table *ngIf="!cambiotab" [settings]="settings" [source]="source" (delete)="onDelete($event)"
        (rowSelect)="itemselec($event)" (edit)="onEdit($event)" (create)="onCreate($event)">
      </ng2-smart-table>

      <ngx-crud-usuario *ngIf="cambiotab" [usuario_id]="uid" (eventChange)="onChange($event)"></ngx-crud-usuario>


    </nb-card-body>
  </nb-card>
</div>
