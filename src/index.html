<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Dosimetry Reports Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script>
      (function seedDemoAuth() {
        function b64(obj) {
          return btoa(unescape(encodeURIComponent(typeof obj === 'string' ? obj : JSON.stringify(obj))));
        }
        var now = Math.floor(Date.now() / 1000);
        var payload = {
          id: 1,
          operador: 1,
          role: 1,
          usuario: 'demo',
          email: 'demo@example.com',
          iat: now,
          exp: now + 60 * 60 * 24 * 365
        };
        var jwt = b64({ alg: 'HS256', typ: 'JWT' }) + '.' + b64(payload) + '.demo';
        try {
          localStorage.setItem('id_token', jwt);
          localStorage.setItem('access_token', jwt);
          localStorage.setItem('auth_app_token', JSON.stringify({
            name: 'nb:auth:jwt:token',
            ownerStrategyName: 'email',
            createdAt: Date.now(),
            value: jwt
          }));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <ngx-app>Loading...</ngx-app>
    <style>
      @-webkit-keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
      @-moz-keyframes spin{0%{-moz-transform:rotate(0)}100%{-moz-transform:rotate(360deg)}}
      @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
      .spinner{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1003;background:#fff;overflow:hidden}
      .spinner div:first-child{display:block;position:relative;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:60%;box-shadow:0 10px 10px 0 rgb(251, 174, 0);transform:translate3d(0,0,0);animation:spin 2s linear infinite}
      .spinner div:first-child:after,.spinner div:first-child:before{content:'';position:absolute;border-radius:50%}
      .spinner div:first-child:before{top:5px;left:5px;right:5px;bottom:5px;box-shadow:0 3px 3px 0 rgba(0, 63, 143,1);-webkit-animation:spin 3s linear infinite;animation:spin 3s linear infinite}
      .spinner div:first-child:after{top:15px;left:15px;right:15px;bottom:15px;box-shadow:0 3px 3px 0 rgba(237,0,0,1);animation:spin 1.5s linear infinite}
    </style>
    <div id="nb-global-spinner" class="spinner">
      <div class="blob blob-0"></div>
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
      <div class="blob blob-5"></div>
    </div>
  </body>
</html>
